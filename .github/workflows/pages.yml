name: Website (GitHub Pages)
# Builds site/ and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# Email signups: set repo variables EMAIL_PROVIDER (kit | mailerlite | buttondown | factory)
# and EMAIL_FORM_ACTION (Settings > Secrets and variables > Actions > Variables). See site/README.md.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FORM_ACTION: ${{ vars.EMAIL_FORM_ACTION }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN || 'moneymadesimple.netlify.app' }}
        run: python3 site/build.py
      - name: Deploy check (links, SEO basics, page-weight budget)
        run: python3 site/tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
