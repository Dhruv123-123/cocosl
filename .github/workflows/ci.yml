name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          FACTORY_LLM: offline
        run: python -m pytest
  apps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Pages are up to date
        run: node money-calculators/build.mjs && node scam-checker/build.mjs && node scam-extension/build.mjs && node tools/build-apps-page.mjs && node tools/build-embed-page.mjs && git diff --exit-code -- money-calculators scam-checker scam-extension apps.html es/apps.html embed.html
