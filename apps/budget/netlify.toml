# Deploy on its own: Netlify > Add new site > Import > base directory apps/budget.
# Then Site settings > Environment variables: GUMROAD_PRODUCT_ID and/or STRIPE_SECRET_KEY.
[build]
  # Save Netlify build credits: skip the deploy when nothing in this folder changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  publish = "."

[functions]
  directory = "netlify/functions"
