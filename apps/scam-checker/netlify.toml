# Deploy on its own: Netlify > Add new site > Import > base directory apps/scam-checker
[build]
  # Save Netlify build credits: skip the deploy when nothing in this folder changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  publish = "."
  command = "node build.mjs"

[functions]
  directory = "netlify/functions"

# The service worker must never be served stale, or updates get stuck.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
