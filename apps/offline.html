<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1d13">
<style>
:root{--ink:#0b1d13;--paper:#f4f1e8;--muted:#5b6b61;--gold:#f2b134}
@media (prefers-color-scheme:dark){:root{--paper:#0b1d13;--ink:#f4f1e8;--muted:#a9b8ae}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
a{color:inherit}
.btn{display:inline-block;background:var(--gold);color:#0b1d13;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none}
p{color:var(--muted)}
</style>
</head>
<body><main>
<h1>You're offline</h1>
<p>This page hasn't been saved on this device yet. Tools you've opened before still work offline, and everything you've entered is still on this device.</p>
<p><a class="btn" href="./">Back to all tools</a></p>
</main></body>
</html>
