# Deploy on its own: Netlify > Add new site > Import > base directory apps/ad-script-builder.
# Free-sample requests land in Site > Forms > ad-sample-request (turn on form detection once).
[build]
  # Save Netlify build credits: skip the deploy when nothing in this folder changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  publish = "."
