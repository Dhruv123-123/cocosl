services:
  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/output:/srv/media:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
  app:
    ports: !reset []
    environment:
      FUNNEL_TRUST_PROXY: "1"
  media:
    profiles: ["disabled"]
volumes:
  caddy_data:
