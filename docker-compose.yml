# docker compose up -d
#   dashboard: http://localhost:8000 (set DASHBOARD_TOKEN in .env first)
#   worker:    runs `factory daily` for every brand each morning and `factory publish` every 10 min
services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./brands:/app/brands
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./brands:/app/brands
    command: ["python", "-m", "contentfactory.worker"]
    restart: unless-stopped

  # Optional: serve rendered media over HTTPS for Instagram/Threads.
  # Put a reverse proxy with TLS (Caddy, Cloudflare Tunnel) in front and set
  # PUBLIC_MEDIA_BASE_URL to its public address.
  media:
    image: caddy:2.8
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ./data/output:/srv:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional free voice: Kokoro-82M behind an OpenAI-compatible API (Apache-2.0).
  #   docker compose --profile voice up -d kokoro
  # then set KOKORO_URL=http://kokoro:8880/v1 in .env for app and worker.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["voice"]
    ports:
      - "8880:8880"
    restart: unless-stopped
