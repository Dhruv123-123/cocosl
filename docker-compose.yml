# docker compose up -d
#   dashboard: http://localhost:8000 (set DASHBOARD_TOKEN in .env first)
#   worker:    each brand's daily run on its own clock, publishing every 10 min, metrics, emails, comments
#   renderer:  renders videos from the queue so publishing never waits on ffmpeg (RENDER_QUEUE=1)
services:
  app:
    build: .
    env_file: .env
    environment:
      RENDER_QUEUE: "1"
    volumes:
      - ./data:/data
      - ./brands:/app/brands
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./brands:/app/brands
    command: ["python", "-m", "contentfactory.worker"]
    environment:
      RENDER_QUEUE: "1"
    restart: unless-stopped

  renderer:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./brands:/app/brands
    command: ["python", "-m", "contentfactory.renderq"]
    restart: unless-stopped

  # Optional: serve rendered media over HTTPS for Instagram/Threads.
  # Put a reverse proxy with TLS (Caddy, Cloudflare Tunnel) in front and set
  # PUBLIC_MEDIA_BASE_URL to its public address.
  media:
    image: caddy:2.8
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ./data/output:/srv:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional: free, natural-sounding voice (Kokoro-82M, Apache-2.0) on your own server.
  #   docker compose --profile kokoro up -d   and set KOKORO_URL=http://kokoro:8880 in .env
  # About 1 GB of RAM on CPU; a Short voices in well under a minute. Use the -gpu image if you have one.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    profiles: ["kokoro"]
    ports:
      - "8880:8880"
    restart: unless-stopped
