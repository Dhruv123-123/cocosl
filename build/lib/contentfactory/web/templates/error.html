{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <h1>{{ {403: 'Not allowed', 404: 'Not found', 400: 'Bad request', 422: 'Bad request'}.get(status, 'Something went wrong') }}</h1>
  <p>{{ message }}</p>
  <a class="btn" href="/">Back to overview</a>
</div>
{% endblock %}
