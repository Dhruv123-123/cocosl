{# Sub-navigation shared by the business pages. #}
<style>
  .biz-nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  .biz-nav a { padding: 6px 12px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(127,127,127,.3); }
  .biz-nav a.on { font-weight: 600; border-color: currentColor; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: start; }
  .board .col { background: rgba(127,127,127,.07); border-radius: 10px; padding: 8px; min-height: 80px; }
  .board .col h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 4px 4px 8px; display: flex; justify-content: space-between; }
  .board .chip { display: block; padding: 8px 10px; margin-bottom: 6px; border-radius: 8px; background: rgba(127,127,127,.12); text-decoration: none; color: inherit; }
  .board .chip small { display: block; opacity: .7; }
  .stat { font-size: 26px; font-weight: 700; }
  .bar { height: 10px; background: rgba(127,127,127,.18); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: #16a34a; }
  .bar > span.proj { background: #f59e0b; }
  .inline-form { display: inline; }
  pre.email { max-height: none; white-space: pre-wrap; font: inherit; background: rgba(127,127,127,.08); padding: 12px; border-radius: 8px; }
  textarea { width: 100%; }
</style>
<nav class="biz-nav">
  {% for label, href in [("Revenue", "/business/revenue"), ("Clients", "/business/clients"), ("Orders & invoices", "/business/orders"), ("Products", "/business/products"), ("Affiliate links", "/business/affiliates")] %}
  <a href="{{ href }}" class="{{ 'on' if request.url.path.startswith(href) else '' }}">{{ label }}</a>
  {% endfor %}
</nav>
