# Dinero Simple: the Spanish-language sister brand of Money Made Simple, for US Hispanic audiences.
# All audience-facing copy is Spanish (language: es). Operator notes, visual prompts and fact-check lists stay
# in English. Every post carries a language_review warning until a fluent speaker signs it off:
#   factory review-language <post id> --by "Name"
name: Dinero Simple
language: es
region: US
niche: finanzas personales prácticas para latinos en Estados Unidos de veintitantos y treinta y tantos
audience: jóvenes latinos en EE. UU. que trabajan, estudian o mandan dinero a su familia y sienten que van atrasados con su dinero
