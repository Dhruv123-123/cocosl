  youtube_about: |-
    Dinero Simple: un paso con tu dinero que puedes dar esta semana, explicado en menos de un minuto.

    Para latinos jóvenes en Estados Unidos que trabajan, estudian o ayudan a su familia y sienten que van atrasados con su dinero. Hablamos de presupuesto que sí funciona, tu primera inversión (fondos índice, Roth IRA, 401(k)), puntaje de crédito y cómo salir de deudas, y apps de dinero comparadas sin rodeos.

    Sin promesas de hacerte rico. Solo pasos concretos, con números reales. Síguenos para un paso de dinero cada semana.

    Cómo lo hacemos: imágenes y voz hechas con herramientas de IA; una persona escribe y verifica cada guion y aprueba cada video. No es asesoría financiera. Sin reseñas falsas ni testimonios hechos con IA.

    Algunos enlaces son de afiliado: podríamos recibir una comisión sin costo extra para ti. Para negocios, usa el enlace del canal.
