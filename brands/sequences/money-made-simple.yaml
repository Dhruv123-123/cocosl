lead_magnet:
  title: The 7-Day Money Reset Checklist
  pitch: "One 15-minute money task a day for a week. No app, no new account needed."
  sections:
    - heading: "Day 1: Find your real number"
      items:
        - Look at your last two paychecks and write down what actually landed in your account (take-home, not salary).
        - "Turn it into a monthly figure: weekly x 52 / 12, every two weeks x 26 / 12, twice a month x 2."
        - List the bills that leave every month (rent, phone, insurance, utilities, minimum debt payments).
        - Take-home minus bills. Write that number down. That's what you actually get to decide about.
    - heading: "Day 2: Subscription sweep"
      items:
        - Open the last two months of statements for your bank account and every card.
        - List every repeating charge and its monthly cost (divide yearly ones by 12).
        - Check your phone's app store subscriptions list too.
        - Cancel or downgrade one thing you wouldn't sign up for again today.
    - heading: "Day 3: The costs that aren't surprises"
      items:
        - List what you paid in the last 12 months that isn't monthly (car repairs, gifts, renewals, travel).
        - Add it up and divide by 12. That's your monthly set-aside.
        - Pick a place to keep it (a separate savings account or a labelled "bucket").
    - heading: "Day 4: Start a small buffer"
      items:
        - Keep savings in a separate account from the one you spend from.
        - Set up an automatic transfer on payday. Any amount counts; $20 is a real start.
        - Check the account is FDIC (bank) or NCUA (credit union) insured and has no monthly fee.
    - heading: "Day 5: Debts on one page"
      items:
        - For each debt write the balance, the interest rate (APR) and the minimum payment.
        - Set every debt to autopay at least the minimum.
        - Pick a method for extra payments, highest rate first (avalanche) or smallest balance first (snowball).
    - heading: "Day 6: Your weekly spending number"
      items:
        - Take-home minus bills minus your Day 3 set-aside minus savings and extra debt payments.
        - Divide by 4.33 (the average number of weeks in a month).
        - That's what you can spend each week on everything else. Write it somewhere you'll see it.
    - heading: "Day 7: Book the check-in"
      items:
        - Put a recurring 20-minute "money check-in" in your calendar, same time every week.
        - "At each check-in: how much of the weekly number is left, anything due soon, one thing to adjust."
        - Done. You've reset. Keep the check-in and the rest gets easier.

