#   factory sequence-preview money-made-simple   (renders every email to output/.../preview/)
# Emails go only to confirmed subscribers, at most one per run, never the same step twice.
#
# Placeholders: {brand} {signoff} {price} {launch_price} {launch_code} {launch_ends_human}
#   {product_name} {link:<key>} {affiliate_name:<slug>}
# Conditionals: {if launch}...{/if} / {if no_launch}...{/if}. The launch is "on" only while
#   launch_price is set and today <= launch_ends, so nothing claims a discount that ended.
#
# BEFORE GOING LIVE
#   1. Create the Gumroad offer code below (LAUNCH, $5 off) or clear launch_price.
#   2. Set launch_ends to the real last day of your launch window (7 days from launch).
