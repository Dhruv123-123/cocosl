    match: "Family Scam-Proofing Kit"
    name: The Family Scam-Proofing Kit
    headline: Make your whole family a hard target in one evening
    subhead: "A printable kit: a family plan with your safe word, a credit freeze tracker for everyone, an account lockdown checklist, and fridge and wallet cards."
    price: "$9"
    includes: "Printable PDF · instant download"
    problem_title: Why families get hit
    problem:
      - Scammers don't need to fool everyone. They need one person in a hurry, which is why they call grandparents and text teenagers.
      - Most families have never talked about what to do, so the first plan gets made in a panic.
    for_who:
      - You're the person your family calls when something looks off
      - You have kids, teens or parents you want covered too
    not_for:
      - You want a service that monitors your accounts for you. This is a printable kit you set up yourself
    faq:
