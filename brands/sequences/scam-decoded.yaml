# ----------------------------------------------------------------- facts used above (verify before sending)
claims_to_verify:
  - claim: "Credit freezes at Equifax, Experian and TransUnion are free and don't affect your credit score."
    source: https://consumer.ftc.gov/articles/what-know-about-credit-freezes-fraud-alerts
  - claim: "Scammers ask for gift cards, wires, crypto and payment apps because the money is hard to get back."
    source: https://consumer.ftc.gov/articles/how-avoid-scam
  - claim: "The FBI suggests families create a secret word or phrase to verify identity, because voices can be cloned."
    source: https://www.ic3.gov/PSA/2024/PSA241203
  - claim: "Report fraud to the FTC at ReportFraud.ftc.gov and internet crime to the FBI at ic3.gov; IdentityTheft.gov gives a recovery plan."
    source: https://reportfraud.ftc.gov/ and https://www.ic3.gov/ and https://www.identitytheft.gov/
  - claim: "'Recovery' offers after a scam are often a second scam."
    source: https://consumer.ftc.gov/articles/what-do-if-you-were-scammed
  - claim: "Forwarding spam texts to 7726 (SPAM) reports them to your carrier (in the checklist)."
    source: https://consumer.ftc.gov/articles/how-recognize-and-report-spam-text-messages
