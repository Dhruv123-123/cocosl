# Funnel file for 1099 Money: lead magnet, welcome sequence, product details for the pitch.
# Loaded by contentfactory.funnel (brandfunnel.py). Check it with
#   factory sequence-check 1099-money       (funnel.sequences.validate_sequence)
#   factory sequence-preview 1099-money     (renders every email to output/.../preview/)
# Emails go only to confirmed subscribers, at most one per run, never the same step twice.
#
# Built around the free 2027 Freelancer Tax Calendar. Day 0 delivers it; days 1, 3 and 5 teach the set-aside, the
# Jan 15 payment and the safe harbor; day 7 pitches the Quarterly Tax Tracker (the calendar says when to pay, the
# tracker says how much). There is no launch price, so there are no launch conditionals: Sender has no date
# conditional (research/scouting/sender-setup-guide.md on PR #2), and the copy reads right on any day.
# The longer 7-email Kit version of this series is apps/freelance-tax/emails/01-07.
#
# BEFORE GOING LIVE
#   1. Replace the example Gumroad URL for the tracker in brands/1099-money.yaml with the real one.
#   2. Check the dates and figures under claims_to_verify against irs.gov.
#   3. Confirm the calendar PDF is live at the lead_magnet url below.

lead_magnet:
  title: The 2027 Freelancer Tax Calendar
  url: https://1099money.netlify.app/downloads/freelancer-tax-calendar-2027.pdf
  pitch: "Every 2027 federal tax date for freelancers on one printable page, with what to do before each one."

# ----------------------------------------------------------------- welcome sequence
name: welcome
min_gap_hours: 20       # never two sequence emails to one person within 20 hours
max_late_days: 3        # if a step is 3+ days overdue (e.g. after downtime), skip it instead of sending late
signoff: "Talk soon,\nThe 1099 Money team"
footer_note: "Educational content, not tax, legal or financial advice. For your own situation, talk to a tax professional. Drafted with AI help and fact-checked by a person."

vars:
  product: quarterly-tax-tracker      # the products: entry below holds the price
  product_name: The Quarterly Tax Tracker
  price: "$15"

links:
  calendar: freebie
  calculator: https://1099money.netlify.app/
  tracker: checkout:quarterly-tax-tracker
  direct_pay: https://www.irs.gov/payments/direct-pay

steps:
  - day_offset: 0
    subject: "Your 2027 Freelancer Tax Calendar"
    preheader: "Put four dates in your phone. That's the whole setup."
    cta_url_key: calendar
    cta_label: Download the calendar
    body_markdown: |
      Hi,

      Here's your calendar: [the 2027 Freelancer Tax Calendar]({link:calendar}).

      It has every federal date a US freelancer needs this year, on one printable page. Two minutes of setup makes it work:

      1. **Print it** and put it where you'll see it.
      2. **Put the four estimated tax dates in your phone**, each with a reminder one week before.
      3. **Open a separate savings account** for tax money, if you don't have one yet. Any free savings account works.

      Over the next week I'll send four short emails: how much to set aside, the January payment, the rule that makes the penalty optional, and a spreadsheet that works out what to pay each quarter.

      {signoff}

  - day_offset: 1
    subject: "How much of each payment to set aside"
    preheader: "Why 25% is a sensible start, with the math."
    cta_url_key: calculator
    cta_label: Work out your own number
    body_markdown: |
      Hi,

      If nobody withholds tax from your pay, the habit that matters most is this: **every time a client pays you, move a fixed percentage into your tax account the same day.**

      How much? Here's a fictional example with 2026 federal figures: single, $60,000 of profit, no other income.

      - **Self-employment tax: about $8,478.** That's Social Security and Medicare, 15.3% on 92.35% of profit. An employer used to pay half; now you pay both halves.
      - **Income tax: about $3,559**, after half the SE tax, the standard deduction and the 20% qualified business income deduction.
      - **Total: about $12,037**, or 20% of profit, before any state tax.

      That's why **25 to 30%** is a sensible starting set-aside for most freelancers: 20% federal, plus room for state tax and a better-than-expected year. Most of the bill is SE tax, so "I'm in the 12% bracket" leads people to save far too little.

      The free calculator works out your own percentage in about a minute.

      {signoff}

  - day_offset: 3
    subject: "The January 15 payment, and the next three"
    preheader: "Four deadlines a year, and they aren't evenly spaced."
    body_markdown: |
      Hi,

      The IRS expects freelance tax four times a year, through estimated payments. The last one for 2026 income is due **Friday, January 15, 2027**. If you're reading this after that date, your next one is **Thursday, April 15, 2027**: the first payment for 2027, due the same day as your 2026 return.

      The 2027 dates are on your calendar:

      - **Apr 15, 2027** for January to March income
      - **Jun 15, 2027** for April and May
      - **Sep 15, 2027** for June to August
      - **Jan 18, 2028** for September to December (Jan 15 is a Saturday and Jan 17 is Martin Luther King Jr. Day)

      Notice the periods aren't equal: two months, then three, then four. The June payment comes only two months after April.

      **How to pay:** IRS Direct Pay ({link:direct_pay}) is free and takes a few minutes. Choose "Estimated Tax" and the right tax year, and save the confirmation number.

      Missed one? Pay as soon as you can. The underpayment penalty works like interest, so it grows with each day you're late.

      {signoff}

  - day_offset: 5
    subject: "The rule that makes the penalty optional"
    preheader: "Pay last year's number on time and you're generally covered."
    body_markdown: |
      Hi,

      The IRS charges an underpayment penalty if you don't pay enough during the year. The **safe harbor** rule takes most of the guesswork out.

      If you pay at least **100% of last year's total tax** (110% if last year's AGI was over $150,000), split into on-time payments by each deadline, you generally owe no penalty, even if this year's bill turns out bigger.

      Fictional example: last year's total tax was $6,500. Pay $1,625 by each deadline and you're covered. If this year's real bill is $12,000, you pay the rest when you file, without a penalty. That's why the set-aside from email 2 still matters: the safe harbor protects you from the penalty, not from the bill.

      The other route is paying 90% of *this* year's tax, which is better if your income drops. But you only know this year's number if you track it.

      So before every deadline, the real question is: **which is smaller right now, and how much have I already paid?** Form 1040-ES has a worksheet for it. Or there's the spreadsheet in my next email.

      {signoff}

  - day_offset: 7
    subject: "The calendar says when. This says how much."
    preheader: "The Quarterly Tax Tracker: what to pay before each deadline, {price}."
    cta_url_key: tracker
    cta_label: Get the Quarterly Tax Tracker
    body_markdown: |
      Hi,

      Your calendar tells you *when* to pay. The question it can't answer is *how much*. That's what **{product_name}** ({price}) is for.

      - **Log as you go:** income, expenses (with categories and a business-use %) and mileage.
      - **Before each deadline it gives you one number:** it compares the safe harbor with this year's actual tax, subtracts what you've already paid and shows the suggested payment.
      - **A set-aside check:** is your tax savings enough for the rest of the year?
      - **Every deadline and federal tax table built in**, plus a guide with a fictional $60,000 worked example.

      It works in Excel, Google Sheets and Apple Numbers. No subscription, no app, no bank login.

      If it isn't useful, reply within 14 days for a refund.

      Not ready? Everything in the free calendar still works. The tracker just does the math.

      {signoff}

# ----------------------------------------------------------------- product details used above
products:
  - slug: quarterly-tax-tracker
    match: "Quarterly Tax Tracker"
    name: The Quarterly Tax Tracker
    headline: Know what to pay the IRS before every quarterly deadline
    subhead: "A spreadsheet that turns your income, expense and mileage logs into one suggested payment per deadline, with the safe harbor built in."
    price: "$15"
    includes: "Spreadsheet (.xlsx) + 10-page PDF guide · instant download"
    refund: "Not useful? Reply within 14 days of purchase for a full refund."
    disclaimer: "Educational tool, not tax, legal or financial advice. The worked example in the guide is fictional."
    ai_disclosure: "This spreadsheet and guide were drafted with AI help and fact-checked by a person."

# ----------------------------------------------------------------- facts used above (verify before sending)
claims_to_verify:
  - claim: "Self-employment tax is 15.3% on 92.35% of net earnings (12.4% Social Security up to the wage base, 2.9% Medicare)."
    source: https://www.irs.gov/businesses/small-businesses-self-employed/self-employment-tax-social-security-and-medicare-taxes
  - claim: "$60,000 profit, single, 2026 federal: SE tax about $8,478, income tax about $3,559, total about $12,037 (site tax model, Rev. Proc. 2025-32)."
    source: apps/freelance-tax/lib/tax.js
  - claim: "The Q4 estimated payment for 2026 is due Fri Jan 15, 2027; 2027 payments are due Apr 15, Jun 15 and Sep 15, 2027 and Jan 18, 2028."
    source: https://www.irs.gov/businesses/small-businesses-self-employed/estimated-taxes
  - claim: "Jan 15, 2028 is a Saturday and Jan 17, 2028 is Martin Luther King Jr. Day, so the Q4 2027 payment moves to Tue Jan 18, 2028."
    source: calendar; IRS Publication 509 (2028 tax calendar) when published
  - claim: "Safe harbor: pay 100% of last year's total tax (110% if last year's AGI was over $150,000), or 90% of this year's, to generally avoid the underpayment penalty."
    source: https://www.irs.gov/publications/p505
  - claim: "IRS Direct Pay is free and accepts estimated tax payments."
    source: https://www.irs.gov/payments/direct-pay
