# Third brand from research/04-adjacent-niches.md: money and taxes for US freelancers.
# One brand = one niche = one account per platform. Tax figures are dated: re-check every January.
name: 1099 Money
niche: money and taxes for US freelancers, creators and side hustlers
audience: first-year freelancers, creators and gig workers in the US who just got (or are about to get) their first 1099
promise: get paid, keep more, never fear April
pillars:
  - quarterly estimated taxes
  - deductions with sources
  - separating business money
  - invoicing and getting paid
  - benefits without an employer
formats: [short, carousel, long]
seed_topics:
  - quarterly estimated taxes
  - self employment tax
  - 1099-nec
  - sep ira
  - solo 401k
  - business bank account
  - home office deduction
  - mileage deduction
  - freelance invoice
  - hsa for self employed
avoid_topics:
  - tax evasion or hiding income
  - aggressive write-off hacks
  - state-specific advice without sources
  - crypto tax schemes
subreddits: [freelance, tax, smallbusiness, sidehustle, selfemployed]
hashtags: [freelancetips, selfemployed, "1099", freelancetaxes, sidehustle, smallbusinesstips, 1099money]
cta: Follow for one freelancer money move a week.
link_in_bio: https://example.com/1099money
voice:
  tone: calm, practical, numbers-first, a little dry, zero hype
  persona: a friend who does the books for creators and freelancers and hates jargon
  tts_voice: ""          # your own cloned voice or a licensed stock voice id
  banned_phrases: ["write off everything", "tax-free money", "the IRS won't know", "guaranteed refund", "this one trick"]
visual:
  palette: ["#14213d", "#f7f3ea", "#ff7a45", "#3cc6a0"]
  font: Inter
  image_style: clean flat vector illustration, deep navy and warm paper cream with a coral accent and a mint highlight, simple shapes, paper textures, no text, no logos
  mascot: a small paper receipt character with a folded corner, round glasses and big eyes (original design)
  watermark: "@1099money"
cadence:
  shorts_per_week: 5
  long_per_week: 1
  carousels_per_week: 3
  max_posts_per_day_per_platform: 2
  post_times: ["12:30", "19:00"]
  timezone: America/New_York
accounts:
  - {platform: instagram, handle: "@1099money", formats: [short, carousel, image]}
  - {platform: youtube, handle: "@1099money", formats: [short, long]}
  - {platform: tiktok, handle: "@1099money", formats: [short]}
