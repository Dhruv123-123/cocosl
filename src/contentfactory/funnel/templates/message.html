<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title }}{% if brand %} · {{ brand.name }}{% endif %}</title>
<style>
:root{--bg:{{ t.dark if t else '#0f172a' }};--fg:{{ t.light if t else '#f8fafc' }};--a:{{ t.accent if t else '#22d3ee' }};
--ai:{{ t.accent_ink if t else '#0f172a' }};--card:{{ t.card if t else '#1e293b' }};--muted:{{ t.muted if t else '#94a3b8' }}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.card{max-width:440px;width:100%;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center}
.icon{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
background:var(--a);color:var(--ai);font-size:28px;font-weight:900}
.icon.err{background:#c2410c;color:#fff}
h1{font-size:22px;margin:0 0 10px}
p{color:var(--muted);line-height:1.5;margin:0 0 12px}
a.btn{display:inline-block;margin-top:8px;background:var(--a);color:var(--ai);font-weight:700;text-decoration:none;
padding:12px 20px;border-radius:12px}
.small{font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <div class="icon{{ ' err' if status == 'error' }}" aria-hidden="true">{{ '!' if status == 'error' else '✓' }}</div>
  <h1>{{ title }}</h1>
  <p>{{ body }}</p>
  {% if extra_html %}{{ extra_html | safe }}{% endif %}
  {% if button %}<a class="btn" href="{{ button[1] }}">{{ button[0] }}</a>{% endif %}
  {% if brand %}<p class="small">{{ brand.name }}{% if brand.ai_disclosure %} · {{ brand.ai_disclosure }}{% endif %}</p>{% endif %}
</main>
</body>
</html>
