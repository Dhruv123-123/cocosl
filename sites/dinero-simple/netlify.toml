# Second Netlify site for Dinero Simple. In Netlify: Add new site > Import > pick cocosl,
# then set Base directory to "sites/dinero-simple" (Netlify then reads this file, not the root one).
[build]
  command = "SITE_ROOT=. python3 ../../site/build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/emails/*"
  [headers.values]
    X-Robots-Tag = "noindex"
