[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contentfactory"
version = "0.1.0"
description = "A compliant, human-in-the-loop AI content studio: ideas, scripts, voice, visuals, video, approval, official-API publishing and revenue tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "pillow>=10",
  "httpx>=0.27",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
claude = ["anthropic>=0.70"]
dev = ["pytest>=8", "anthropic>=0.70", "openpyxl>=3.1", "python-docx>=1.1"]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]   # local Kokoro-82M voice; or run the kokoro service in docker-compose

[project.scripts]
factory = "contentfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contentfactory = ["web/templates/*.html", "web/static/*", "business/templates/*.html", "funnel/templates/*.html", "funnel/templates/funnel/*.html", "brandkit/templates/*.html", "media/*.json", "media/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
